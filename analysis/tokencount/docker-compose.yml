services:
  tokencount:
    build: .
    container_name: tokencount-service
    volumes:
      # Mount the entire data directory (read-only for input)
      - ../../data:/app/data:rw
    environment:
      - PYTHONUNBUFFERED=1
    command: python token_counter.py
    restart: "no"
    
  # Alternative service for custom settings
  tokencount-custom:
    build: .
    container_name: tokencount-custom
    volumes:
      # Mount the entire data directory
      - ../../data:/app/data:rw
      # Mount custom settings if needed
      - ./settings.json:/app/settings.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: python token_counter.py --settings settings.json
    restart: "no"
    profiles:
      - custom
